<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上海地铁运行图 · 动态模拟</title>
<meta name="description" content="按一天中不同时刻动态显示上海地铁各线路列车运行的2D线路图，含双向列车与发车间隔变化。">
<style>
:root {
  --background: #fcfcfd; --foreground: #18181b; --card: #ffffff; --card-foreground: #18181b;
  --muted: #f4f4f5; --muted-foreground: #71717c; --accent: #eef2ff; --accent-foreground: #1e1b4b;
  --border: #e4e4e7; --ring: #6366f1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #101014; --foreground: #f4f4f5; --card: #141418; --card-foreground: #f4f4f5;
    --muted: #1c1c22; --muted-foreground: #9d9da8; --accent: #23233a; --accent-foreground: #e0e7ff;
    --border: #2a2a33;
  }
}
html, body { margin: 0; padding: 0; background: var(--background); color: var(--foreground);
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
body { padding: 22px; }
.container { max-width: 1080px; margin: 0 auto; }
.site-foot { color: var(--muted-foreground); font-size: 12px; margin-top: 14px; text-align: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 30px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--foreground); font-size: 13px; cursor: pointer; }
.btn:hover { background: var(--muted); }
.form-select { height: 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
  color: var(--foreground); font-size: 12.5px; padding: 0 6px; }
.form-range { width: 100%; accent-color: var(--foreground); }
.text-muted { color: var(--muted-foreground); }
.text-small { font-size: 12px; }
.tabular-nums { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.viz-stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.viz-stat-value { font-size: 17px; font-weight: 500; }
hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
i[data-lucide] { width: 15px; height: 15px; display: inline-block; }
</style>
</head>
<body>
<div class="container">
<script id="lucide-fallback">
/* 图标：优先在线加载 Lucide，失败时用文本符号兜底 */
(function () {
  var loaded = false;
  function glyphify() {
    document.querySelectorAll('i[data-lucide]').forEach(function (el) {
      var n = el.getAttribute('data-lucide');
      var span = document.createElement('span');
      span.textContent = n === 'pause' ? '⏸' : n === 'play' ? '▶' : n;
      span.style.fontSize = '13px';
      el.replaceWith(span);
    });
  }
  window.__lucideFallback = function () {
    if (loaded) return;
    loaded = true;
    if (typeof window.lucide === 'undefined') {
      window.lucide = { createIcons: function () { glyphify(); } };
    }
    glyphify();
  };
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js';
  s.onload = function () { try { lucide.createIcons({ attrs: { width: 15, height: 15 } }); } catch (e) { window.__lucideFallback(); } };
  s.onerror = function () { window.__lucideFallback(); };
  setTimeout(window.__lucideFallback, 3500);
  document.head.appendChild(s);
})();
</script>
<style id="shmetro-style">
#shmetro-app { --shline-w: 3.4px; }
.shmetro-root { display: flex; gap: 18px; align-items: stretch; }
.shmetro-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.shmetro-side { flex: 0 0 300px; max-width: 300px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

.shmetro-topbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.shmetro-clock { display: flex; align-items: baseline; gap: 10px; }
.shmetro-clock-time { font-size: 34px; font-weight: 500; line-height: 1; }
.shmetro-clock-band { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); align-self: center; }
.shmetro-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.shmetro-speed-label { display: flex; align-items: center; gap: 6px; }
.shmetro-label-lite { font-size: 12px; color: var(--muted-foreground); }

.shmetro-slider-row { display: flex; flex-direction: column; gap: 2px; }
.shmetro-slider-ticks { position: relative; height: 15px; }
.shmetro-slider-ticks span { position: absolute; transform: translateX(-50%); }
.shmetro-slider-ticks span:first-child { transform: none; }
.shmetro-slider-ticks span:last-child { transform: translateX(-100%); }

.shmetro-map-wrap { position: relative; width: 100%; }
#metro-canvas { display: block; width: 100%; border-radius: 10px; }
.shmetro-viewctl { position: absolute; right: 10px; top: 10px; z-index: 4; display: flex; gap: 6px; }
.shmetro-zbtn { width: 28px; min-width: 28px; height: 26px; padding: 0; background: var(--card); font-size: 15px; line-height: 1; }
.shmetro-reset { font-size: 12px; height: 26px; padding: 0 9px; background: var(--card); }
.shmetro-tip { position: absolute; pointer-events: none; z-index: 5; background: var(--popover); color: var(--popover-foreground);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.45;
  box-shadow: 0 4px 14px rgba(0,0,0,.14); max-width: 240px; white-space: nowrap; }
.shmetro-dir-legend { position: absolute; left: 10px; bottom: 10px; z-index: 4; display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted-foreground); background: var(--card); color: var(--card-foreground);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }
.l-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.6px solid var(--shline-demo, #999); }
[dir] .l-dot.dir-fwd { background: var(--shline-demo, #999); }
.l-dot.dir-bwd { background: transparent; }

.shmetro-side-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.shmetro-lines-list { display: flex; flex-direction: column; gap: 2px; max-height: 62vh; overflow-y: auto; padding-right: 4px; }
.shmetro-line-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 7px; cursor: pointer;
  border: none; background: transparent; width: 100%; text-align: left; font-size: 12.5px; color: var(--foreground); }
.shmetro-line-row:hover { background: var(--muted); }
.shmetro-line-row.is-selected { background: var(--accent); color: var(--accent-foreground); }
.shmetro-chip { width: 20px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.shmetro-row-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0 6px; }
.shmetro-row-name { display: flex; gap: 6px; align-items: baseline; }
.shmetro-row-name small { color: var(--muted-foreground); }
.shmetro-row-val { display: flex; gap: 10px; color: var(--muted-foreground); font-size: 11.5px; }

.shmetro-detail-card h3 { margin: 6px 0 8px; font-size: 15px; }
.shmetro-dpat { margin-bottom: 10px; }
.shmetro-dpat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.shmetro-dpat-head .shmetro-dpat-name { font-weight: 500; font-size: 12.5px; }
.shmetro-dpat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; }
.shmetro-dcell { background: var(--muted); border-radius: 7px; padding: 6px 8px; }
.shmetro-dcell b { display: block; font-weight: 500; }
.shmetro-dcell .text-small { display: block; }
.shmetro-interval-chart svg { display: block; width: 100%; height: 64px; }

@media (max-width: 860px) {
  .shmetro-root { flex-direction: column; }
  .shmetro-side { flex: 1 1 auto; max-width: none; }
  .shmetro-lines-list { max-height: none; }
}
</style>

<div id="shmetro-app" class="shmetro-root">
  <div class="shmetro-main">
    <div class="shmetro-topbar">
      <div class="shmetro-clock">
        <span class="shmetro-clock-time tabular-nums" id="clock-time">07:45</span>
        <span class="shmetro-clock-band" id="clock-band"></span>
      </div>
      <div class="shmetro-ctl">
        <button type="button" class="btn" id="btn-play" aria-label="播放或暂停模拟" data-tooltip="播放 / 暂停">
          <i data-lucide="pause" aria-hidden="true"></i>
        </button>
        <label class="shmetro-speed-label" for="sel-speed">
          <span class="shmetro-label-lite">速度</span>
          <select id="sel-speed" class="form-select" aria-label="播放速度">
            <option value="5">5×（接近实时观感）</option>
            <option value="60" selected>60×（1秒=1分钟）</option>
            <option value="240">240×</option>
            <option value="900">900×（约16秒放完一天）</option>
          </select>
        </label>
      </div>
    </div>
    <div class="shmetro-slider-row">
      <label for="rng-time" class="sr-only">模拟时间</label>
      <input id="rng-time" class="form-range" type="range" min="0" max="1" step="0.001" value="0" aria-label="模拟时间，拖动跳转时刻" />
      <div class="shmetro-slider-ticks text-muted text-small" aria-hidden="true">
        <span style="left:0%">05:00</span><span style="left:21.7%">09:00</span><span style="left:42.8%">13:00</span><span style="left:63.8%">17:00</span><span style="left:84.9%">21:00</span><span style="left:99.5%">24:00</span>
      </div>
    </div>
    <div class="shmetro-map-wrap">
      <canvas id="metro-canvas" role="img" aria-label="上海地铁线路图动画：随时间推进显示各线路双向列车位置，支持滚轮缩放与拖拽平移"></canvas>
      <div class="shmetro-viewctl">
        <button type="button" class="btn shmetro-zbtn" id="btn-zin" aria-label="放大地图" data-tooltip="放大">＋</button>
        <button type="button" class="btn shmetro-zbtn" id="btn-zout" aria-label="缩小地图" data-tooltip="缩小">－</button>
        <button type="button" class="btn shmetro-reset" id="btn-reset" data-tooltip="恢复默认视野">重置视野</button>
      </div>
      <div class="shmetro-tip" id="map-tip" role="status" aria-live="polite" hidden></div>
      <div class="shmetro-dir-legend" aria-hidden="true">
        <span class="l-dot dir-fwd"></span><span>上行/始发方向</span>
        <span class="l-dot dir-bwd"></span><span>对向</span>
      </div>
    </div>
  </div>
  <div class="shmetro-side">
    <div class="shmetro-side-stats" id="net-stats" aria-live="polite">
      <div class="viz-stat"><div class="text-muted text-small">当前在线列车（双向合计）</div><div class="viz-stat-value tabular-nums" id="stat-trains">—</div></div>
      <div class="viz-stat"><div class="text-muted text-small">当前最密集的线路</div><div class="viz-stat-value" id="stat-busiest">—</div></div>
    </div>
    <div id="line-detail"></div>
    <div class="shmetro-linepick">
      <div class="text-small text-muted">点击列表选择线路，或在图上直接点选</div>
      <div class="shmetro-lines-list" id="lines-list" role="listbox" aria-label="线路选择"></div>
    </div>
    <hr />
    <p class="text-small text-muted" id="src-note">数据说明：首末班车与站序取自上海地铁官网接口（service.shmetro.com，工作日时刻），站线坐标取自百度地图地铁示意数据；发车间隔为公开报道整理的近似值，仅供参考，具体以车站现场公告为准。动画按间隔自动排班模拟，非逐列真实时刻表。</p>
  </div>
</div>

<script>

      return { x: pts[lo].x + f * (pts[lo + 1].x - pts[lo].x), y: pts[lo].y + f * (pts[lo + 1].y - pts[lo].y) };
    }
    function sched(dirKey) {
      var w = p[dirKey];
      var s = t2sec(w.dep_first), e = t2sec(w.dep_last);
      var dep = [];
      if (s >= 0 && e >= 0) {
        var t = s, guard = 0;
        while (t <= e && guard++ < 800) {
          dep.push(t);
          t += Math.round(hwAt(p.no, t) * (p.branch_factor || 1));
        }
      }
      return dep;
    }
    var color = RAW.lines.filter(function (l) { return l.no === p.no; })[0].color;
    return {
      idx: i, no: p.no, kind: p.kind, gid: p.gid, name: p.name, color: color,
      fwd: p.fwd, bwd: p.bwd, dFwd: p.fwd.D, dBwd: p.bwd.D,
      schedF: sched('fwd'), schedB: sched('bwd'),
      mileageAt: mileageAt, xyAt: xyAt, st: p.st, total: total, rawPts: p.pts
    };
  });

  var byLine = {};
  PAT.forEach(function (p) { (byLine[p.no] = byLine[p.no] || []).push(p); });
  var lineById = {};
  RAW.lines.forEach(function (l) { lineById[l.no] = l; });

  function countActive(P, dep, D, simSec) {
    if (!dep.length) return 0;
    var lo = 0, hi = dep.length;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (dep[mid] <= simSec) lo = mid + 1; else hi = mid; }
    var n = 0, k = lo - 1;
    while (k >= 0 && dep[k] + D >= simSec) { n++; k--; }
    return n;
  }
  function collectActive(out, P, dep, D, simSec, dir) {
    if (!dep.length) return;
    var lo = 0, hi = dep.length;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (dep[mid] <= simSec) lo = mid + 1; else hi = mid; }
    var k = lo - 1;
    while (k >= 0 && dep[k] + D >= simSec) {
      out.push({ p: P, dir: dir, dep: dep[k], travel: simSec - dep[k], D: D });
      k--;
    }
  }
  function trainsAt(simSec) {
    var out = [];
    for (var i = 0; i < PAT.length; i++) {
      var P = PAT[i];
      collectActive(out, P, P.schedF, P.dFwd, simSec, +1);
      collectActive(out, P, P.schedB, P.dBwd, simSec, -1);
    }
    return out;
  }

  // ---------- static scene ----------
  var scale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0, dpr = 1;
  function px(x) { return offX + (x - X_MIN) * scale; }
  function py(y) { return offY + (y - Y_MIN) * scale; }
  var scene = document.createElement('canvas');
  function rebuildScene() {
    scene.width = Math.max(1, Math.round(cssW * dpr));
    scene.height = Math.max(1, Math.round(cssH * dpr));
    var c = scene.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, cssW, cssH);
    c.lineCap = 'round'; c.lineJoin = 'round';
    PAT.forEach(function (P) {
      c.strokeStyle = P.color; c.lineWidth = 4.2; c.globalAlpha = 0.92;
      c.beginPath();
      P.rawPts.forEach(function (a, i) { i ? c.lineTo(px(a[0]), py(a[1])) : c.moveTo(px(a[0]), py(a[1])); });
      c.stroke();
    });
    c.globalAlpha = 1;
    var inter = {}, term = {}, stnIdx = {};
    RAW.stations.forEach(function (s) { stnIdx[s.k] = s; if (s.lines.length >= 2) inter[s.k] = s; });
    PAT.forEach(function (P) {
      (P.st || []).forEach(function (s0, i, a) {
        if (i === 0 || i === a.length - 1) {
          var st = stnIdx[s0.name];
          if (st) term[s0.name] = st;
        }
      });
    });
    c.fillStyle = TH.mut; c.globalAlpha = 0.5;
    RAW.stations.forEach(function (s) {
      if (s.lines.length === 1 && !term[s.k]) {
        c.beginPath(); c.arc(px(s.x), py(s.y), Math.max(1.2, scale * 3), 0, 6.2832); c.fill();
      }
    });
    c.globalAlpha = 1;
    Object.keys(inter).forEach(function (k) {
      var s = inter[k];
      c.beginPath(); c.fillStyle = TH.card; c.strokeStyle = TH.fg; c.lineWidth = 1.3;
      c.arc(px(s.x), py(s.y), Math.max(2.8, scale * 8), 0, 6.2832); c.fill(); c.stroke();
    });
    // labels
    c.font = '10.5px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'bottom';
    var taken = [];
    function free(x, y, w) {
      if (x - w / 2 < 3 || x + w / 2 > cssW - 3 || y < 12 || y > cssH - 13) return false;
      for (var i = 0; i < taken.length; i++) {
        var t = taken[i];
        if (Math.abs(t.x - x) < (t.w + w) / 2 + 5 && Math.abs(t.y - y) < 13) return false;
      }
      return true;
    }
    function drawLabel(nm, x, y, strong) {
      var w = 10.5 * nm.length;
      var place = [[0, -9], [0, 16], [-0.6 * w, -2], [0.6 * w, -2]];
      var lx = null, ly = null;
      for (var i = 0; i < place.length; i++) {
        var tx = x + place[i][0], ty = y + place[i][1];
        if (free(tx, ty, w)) {
          lx = tx; ly = ty;
          taken.push({ x: tx, y: ty, w: w });
          break;
        }
      }
      if (lx == null && !strong) return;   // no room: drop weak labels
      if (lx == null) { lx = x; ly = y - 9; }
      lx = Math.max(w / 2 + 3, Math.min(cssW - w / 2 - 3, lx));
      ly = Math.max(13, Math.min(cssH - 13, ly));
      c.save();
      c.strokeStyle = TH.bg; c.lineWidth = 3;
      c.globalAlpha = strong ? 1 : 0.92;
      c.strokeText(nm, lx, ly);
      c.fillStyle = TH.fg;
      c.fillText(nm, lx, ly);
      c.restore();
    }
    Object.keys(term).forEach(function (k) {
      var s = term[k];
      if (s) drawLabel(s.name || s.k, px(s.x), py(s.y), true);
    });
    Object.keys(inter).forEach(function (k) {
      if (term[k]) return;
      var s = inter[k];
      if (s) drawLabel(s.name || s.k, px(s.x), py(s.y), false);
    });
  }

  // ---------- sim state ----------
  var state = { t: 7 * 3600 + 45 * 60, playing: true, speed: 60, sel: null, zoom: 1, panX: 0, panY: 0 };
  var baseScale = 1;
  function clampPan() {
    var mx = Math.max(60, DOMW * scale - 60);
    var my = Math.max(60, DOMH * scale - 60);
    if (state.panX > mx) state.panX = mx;
    if (state.panX < -mx) state.panX = -mx;
    if (state.panY > my) state.panY = my;
    if (state.panY < -my) state.panY = -my;
  }
  function applyView() {
    if (!cssW) return;
    scale = baseScale * state.zoom;
    clampPan();
    offX = (cssW - DOMW * scale) / 2 + state.panX;
    offY = (cssH - DOMH * scale) / 2 + state.panY;
  }
  function scheduleScene() {
    if (!cssW) return;
    rebuildScene();
    draw();
  }
  function zoomAt(cx, cy, factor) {
    var z0 = state.zoom;
    var z1 = Math.max(0.75, Math.min(5, z0 * factor));
    if (Math.abs(z1 - z0) < 1e-6) return;
    state.panX = state.panX * (z1 / z0) + (cx - cssW / 2) * (1 - z1 / z0);
    state.panY = state.panY * (z1 / z0) + (cy - cssH / 2) * (1 - z1 / z0);
    state.zoom = z1;
    applyView();
    scheduleScene();
  }
  var lastTs = null;
  var lastTSec = -1, lastHud = 0, dirtyRows = true, selected = null;

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.drawImage(scene, 0, 0, cssW, cssH);
    var simSec = Math.floor(state.t);
    var trains = trainsAt(simSec);
    // selected-line veil
    if (selected != null) {
      ctx.save();
      ctx.globalAlpha = 0.14;
      ctx.fillStyle = TH.bg; ctx.fillRect(0, 0, cssW, cssH);
      ctx.restore();
      var sc = lineById[selected].color;
      ctx.save();
      ctx.strokeStyle = sc; ctx.lineWidth = 6; ctx.globalAlpha = 1;
      PAT.filter(function (p) { return p.no === selected; }).forEach(function (P) {
        ctx.beginPath();
        P.rawPts.forEach(function (a, i) { i ? ctx.lineTo(px(a[0]), py(a[1])) : ctx.moveTo(px(a[0]), py(a[1])); });
        ctx.stroke();
      });
      ctx.restore();
    }
    for (var i = 0; i < trains.length; i++) {
      var tr = trains[i], P = tr.p;
      var m = P.mileageAt(tr.travel);
      if (tr.dir < 0) m = P.total - m;
      var pos = P.xyAt(m);
      var x = px(pos.x), y = py(pos.y);
      var a = Math.min(1, Math.min(tr.travel, tr.D - tr.travel) / 15);
      ctx.globalAlpha = 0.28 + a * 0.72;
      if (tr.dir > 0) {
        ctx.beginPath(); ctx.fillStyle = P.color;
        ctx.arc(x, y, scale * 7.4 + 1.7, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = TH.card; ctx.lineWidth = 1.2; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.fillStyle = TH.card;
        ctx.arc(x, y, scale * 7.4 + 1.7, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = P.color; ctx.lineWidth = 1.7; ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    hud(simSec, trains);
  }

  function hud(simSec, trains) {
    var now = performance.now();
    if (now - lastHud < 160) return;
    lastHud = now;
    if (simSec !== lastTSec) {
      lastTSec = simSec;
      document.getElementById('clock-time').textContent = hms(simSec);
      var b = bands[bandAt(simSec)];
      document.getElementById('clock-band').textContent = '工作日 · ' + b.name;
      var rngEl = document.getElementById('rng-time');
      if (document.activeElement !== rngEl) rngEl.value = (simSec - T_MIN) / (T_MAX - T_MIN);
    }
    document.getElementById('stat-trains').textContent = trains.length;
    var mx = {};
    trains.forEach(function (tr) { mx[tr.p.no] = (mx[tr.p.no] || 0) + 1; });
    var best = null, bestN = 0;
    Object.keys(mx).forEach(function (k) { if (mx[k] > bestN) { bestN = mx[k]; best = +k; } });
    document.getElementById('stat-busiest').textContent = best != null ? lineById[best].name + ' · ' + bestN + ' 列' : '—';
    if (dirtyRows) { renderRows(trains); dirtyRows = false; }
  }

  function frame(ts) {
    if (state.playing) {
      if (lastTs == null) lastTs = ts;
      var dt = Math.min(240, ts - lastTs); lastTs = ts;
      state.t += dt / 1000 * state.speed;
      if (state.t >= T_MAX) state.t = T_MIN;
    } else { lastTs = null; }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- hover / click ----------
  var rafPending = null;
  canvas.addEventListener('pointermove', function (ev) {
    if (rafPending || drag || pinch) return;
    var rect = canvas.getBoundingClientRect();
    var cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
    rafPending = requestAnimationFrame(function () { rafPending = null; hoverAt(cx, cy); });
  });
  canvas.addEventListener('pointerleave', hideTip);
  canvas.addEventListener('click', function (ev) {
    if (suppressClick) { suppressClick = false; return; }
    var rect = canvas.getBoundingClientRect();
    var h = hit(ev.clientX - rect.left, ev.clientY - rect.top);
    if (h && h.type === 'line') select(h.no);
  });
  function hit(cx, cy) {
    var bestSt = null, bestD = 8 * 8 * 2.2;
    for (var i = 0; i < RAW.stations.length; i++) {
      var s = RAW.stations[i];
      var dx = px(s.x) - cx, dy = py(s.y) - cy;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestSt = { type: 'station', s: s }; bestD = d; }
    }
    if (bestSt) return bestSt;
    var best = null; bestD = 43;
    for (var j = 0; j < PAT.length; j++) {
      var P = PAT[j], arr = P.rawPts;
      for (var k = 1; k < arr.length; k++) {
        var x1 = px(arr[k - 1][0]), y1 = py(arr[k - 1][1]);
        var dx = px(arr[k][0]) - x1, dy = py(arr[k][1]) - y1;
        var L2 = dx * dx + dy * dy || 1;
        var t = Math.max(0, Math.min(1, ((cx - x1) * dx + (cy - y1) * dy) / L2));
        var ex = x1 + t * dx - cx, ey = y1 + t * dy - cy;
        var d2 = ex * ex + ey * ey;
        if (d2 < bestD) { best = { type: 'line', no: P.no }; bestD = d2; }
      }
    }
    return best;
  }
  function hoverAt(cx, cy) {
    var h = hit(cx, cy);
    if (!h) { hideTip(); return; }
    if (h.type === 'station') {
      var s = h.s;
      var linesTxt = (s.lines || []).map(function (n) {
        var ln = lineById[n];
        return ln ? '<span style="color:' + ln.color + '">●</span>' + ln.name : '';
      }).join('&ensp;');
      showTip('<b>' + (s.name || s.k) + '</b>' + (s.lines && s.lines.length > 1 ? ' <span class=\"text-muted\">换乘</span>' : ''), linesTxt, cx, cy);
    } else {
      var t = Math.floor(state.t);
      var pats = byLine[h.no] || [];
      var inNow = 0;
      pats.forEach(function (P) {
        inNow += countActive(P, P.schedF, P.dFwd, t) + countActive(P, P.schedB, P.dBwd, t);
      });
      var iv = (hwAt(h.no, t) / 60).toFixed(1);
      var cap = (pats.length && pats[0].kind === 'loop') ? '内外环全程约 ' + Math.round(pats[0].dFwd / 60) + ' 分' :
        '主线全程约 ' + Math.round(pats[0].dFwd / 60) + ' 分';
      showTip('<span style=\"color:' + lineById[h.no].color + '\">●</span><b> ' + lineById[h.no].name + '</b>',
        '此刻发车间隔 ≈' + iv + ' 分 · 在线 ' + inNow + ' 列<br/><span style="color:var(--muted-foreground)">' + cap + '，点击看时刻详情</span>', cx, cy);
    }
  }
  function showTip(t1, t2, cx, cy) {
    tip.hidden = false;
    tip.innerHTML = t1 + '<br/>' + t2;
    var x = cx + 14, y = cy - 12;
    var wr = wrap.getBoundingClientRect(), tr = tip.getBoundingClientRect();
    if (x + tr.width > wr.width - 6) x = Math.max(4, cx - tr.width - 12);
    if (y + tr.height > wr.height - 6) y = Math.max(4, cy - tr.height - 10);
    if (y < 2) y = 2;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip() { tip.hidden = true; }

  // ---------- sidebar ----------
  var rowEls = {};
  function renderRows(trains) {
    var listEl = document.getElementById('lines-list');
    var counts = {};
    (trains || []).forEach(function (tr) { counts[tr.p.no] = (counts[tr.p.no] || 0) + 1; });
    var t = Math.floor(state.t);
    if (!listEl.dataset.built) {
      var html = '';
      RAW.lines.forEach(function (l) {
        var pats = byLine[l.no] || [];
        var tag = pats.length > 1 ? '（含支线）' : (pats[0] && pats[0].kind === 'loop' ? '（环线）' : '');
        html += '<button type="button" class="shmetro-line-row" role="option" aria-selected="false" data-no="' + l.no + '">' +
          '<span class="shmetro-chip" style="background:' + l.color + '"></span>' +
          '<span class="shmetro-row-main"><span class="shmetro-row-name">' + l.name + '<small>' + tag + '</small></span>' +
          '<span class="shmetro-row-val"><span class="rv-count"></span><span class="rv-iv"></span></span></span></button>';
      });
      listEl.innerHTML = html;
      listEl.dataset.built = '1';
      Array.prototype.forEach.call(listEl.querySelectorAll('.shmetro-line-row'), function (btn) {
        rowEls[+btn.getAttribute('data-no')] = btn;
        btn.addEventListener('click', function () { select(+btn.getAttribute('data-no')); });
      });
    }
    RAW.lines.forEach(function (l) {
      var pats = byLine[l.no] || [];
      var iv = pats.length ? (hwAt(l.no, t) / 60).toFixed(1) : '—';
      var btn = rowEls[l.no];
      if (!btn) return;
      var b = btn.classList;
      if (selected === l.no) b.add('is-selected'); else b.remove('is-selected');
      btn.setAttribute('aria-selected', selected === l.no ? 'true' : 'false');
      var vs = btn.querySelectorAll('.rv-count, .rv-iv');
      if (vs[0]) vs[0].textContent = (counts[l.no] || 0) + ' 列在线';
      if (vs[1]) vs[1].textContent = '≈' + iv + ' 分/列';
    });
  }
  function select(no) {
    selected = no;
    dirtyRows = true;
    var l = lineById[no];
    var t = Math.floor(state.t);
    var pats = byLine[no] || [];
    var html = '<div class="shmetro-detail-card"><h3><span class="shmetro-chip" style="display:inline-block;background:' + l.color + ';margin-right:7px"></span>' + l.name + '<span style="font-size:12px;color:var(--muted-foreground);font-weight:400;margin-left:8px">' + bands[bandAt(t)].name + '</span></h3>';
    pats.forEach(function (P, pi) {
      ['fwd', 'bwd'].forEach(function (dk) {
        var w = P[dk];
        var D = dk === 'fwd' ? P.dFwd : P.dBwd;
        var iv = (hwAt(no, t) * (P.branch_factor || 1) / 60).toFixed(1);
        var route = P.kind === 'loop' ? w.label : (w.label.indexOf('始发') >= 0 ? w.label : w.label);
        html += '<div class="shmetro-dpat">' +
          '<div class="shmetro-dpat-head"><span class="shmetro-dpat-name">' + w.label + (P.gid === 'branch' ? ' <span class="text-muted text-small">支线</span>' : '') + '</span>' +
          '<span class="text-muted text-small">全程 ' + Math.round(D / 60) + ' 分 · ' + (P.st ? P.st.length : 0) + ' 站</span></div>' +
          '<div class="shmetro-dpat-grid">' +
          '<div class="shmetro-dcell"><b class="tabular-nums">' + w.dep_first + ' — ' + w.dep_last + '</b><span class="text-small text-muted">首班车—末班车发车（' + w.from.split('(')[0] + '）</span></div>' +
          '<div class="shmetro-dcell"><b class="tabular-nums">≈ ' + iv + ' 分</b><span class="text-small text-muted">当前时刻发车间隔</span></div>' +
          '</div></div>';
      });
      html += intervalChart(P);
    });
    html += '</div>';
    document.getElementById('line-detail').innerHTML = html;
    persistState();
  }
  function intervalChart(P) {
    var t0 = t2sec(P.fwd.dep_first), t1 = t2sec(P.fwd.dep_last);
    if (t0 < 0) t0 = T_MIN;
    var W = 262, H = 56, STEPS = 60;
    var segs = [], cur = null;
    for (var i = 0; i <= STEPS; i++) {
      var tt = T_MIN + (T_MAX - T_MIN) * i / STEPS;
      var op = tt >= t0 && tt <= t1;
      var hv = (hwAt(P.no, tt) * (P.branch_factor || 1)) / 60;
      if (op) {
        if (!cur) cur = [];
        cur.push([tt, Math.min(hv, 22)]);
      } else if (cur) { segs.push(cur); cur = null; }
    }
    if (cur && cur.length > 1) segs.push(cur);
    var paths = '';
    segs.forEach(function (s) {
      var d = s.map(function (pt, i) {
        var x = (pt[0] - T_MIN) / (T_MAX - T_MIN) * W;
        var y = H - 6 - Math.max(0, pt[1] - 2) / 20 * (H - 12);
        return (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
      }).join('');
      paths += '<path d="' + d + '" fill="none" stroke="' + P.color + '" stroke-width="2"/>';
    });
    var ax = '<line x1="0" y1="' + (H - 6) + '" x2="' + W + '" y2="' + (H - 6) + '" stroke="' + TH.border + '" stroke-width="1"/>';
    bands.forEach(function (b) {
      var x = (b.from - T_MIN) / (T_MAX - T_MIN) * W;
      ax += '<line x1="' + x.toFixed(1) + '" y1="2" x2="' + x.toFixed(1) + '" y2="' + (H - 6) + '" stroke="' + TH.border + '" stroke-dasharray="2 3" stroke-width="1"/>';
    });
    return '<div class="shmetro-interval-chart" aria-hidden="true"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + ax + paths + '</svg></div>' +
      '<div class="text-small text-muted" style="margin-bottom:2px;" >发车间隔全天曲线（分钟，22封顶），断线时段已收车 · 竖线为时段分界</div>';
  }

  // ---------- persistence ----------
  function persistState() {
    try {
      if (!window.zcode || !window.zcode.setWidgetState) return;
      var pr = window.zcode.setWidgetState({
        modelContent: { t: Math.floor(state.t), speed: state.speed, playing: state.playing, sel: selected }
      });
      if (pr && pr.catch) pr.catch(function () { });
    } catch (e) { }
  }
  function loadState() {
    try {
      var st = window.zcode && window.zcode.widgetState ? window.zcode.widgetState : null;
      var s = (st && (st.modelContent || st)) || {};
      if (typeof s.t === 'number' && s.t >= T_MIN && s.t <= T_MAX) { state.t = s.t; lastTSec = -1; }
      if (typeof s.speed === 'number') { state.speed = s.speed; document.getElementById('sel-speed').value = String(state.speed); }
      if (typeof s.playing === 'boolean') state.playing = reduceMotion ? false : s.playing;
      if (s.sel != null) select(s.sel);
    } catch (e) { }
  }

  // ---------- controls ----------
  var btnPlay = document.getElementById('btn-play');
  function syncPlayIcon() {
    btnPlay.innerHTML = state.playing ? '<i data-lucide="pause" aria-hidden="true"></i>' : '<i data-lucide="play" aria-hidden="true"></i>';
    btnPlay.setAttribute('aria-label', state.playing ? '暂停模拟' : '播放模拟');
    if (!state.playing) btnPlay.setAttribute('data-tooltip', '播放'); else btnPlay.setAttribute('data-tooltip', '暂停');
    try { lucide.createIcons({ attrs: { width: 16, height: 16 } }); } catch (e) { }
  }
  btnPlay.addEventListener('click', function () {
    state.playing = !state.playing; syncPlayIcon(); persistState();
  });
  document.getElementById('sel-speed').addEventListener('change', function () { state.speed = +this.value; persistState(); });
  document.getElementById('rng-time').addEventListener('input', function () {
    state.t = T_MIN + (+this.value) * (T_MAX - T_MIN);
    lastTSec = -1; persistState();
  });

  // ---------- zoom & pan ----------
  var drag = null, dragMoved = false, suppressClick = false;
  var activePt = new Map();
  var pinch = null;   // {d0, zoom0, cx0, panX0, panY0}
  canvas.addEventListener('pointerdown', function (e) {
    activePt.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePt.size === 1) {
      drag = { x: e.clientX, y: e.clientY, px: state.panX, py: state.panY };
      dragMoved = false;
    } else {
      drag = null;
      var arr = Array.from(activePt.values());
      pinch = { d0: Math.max(20, Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y)), zoom0: state.zoom,
                cx0: (arr[0].x + arr[1].x) / 2, cy0: (arr[0].y + arr[1].y) / 2,
                px0: state.panX, py0: state.panY };
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (activePt.has(e.pointerId)) activePt.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) dragMoved = true;
      state.panX = drag.px + dx; state.panY = drag.py + dy;
      applyView(); scheduleScene();
      return;
    }
    if (pinch && activePt.size === 2) {
      var arr = Array.from(activePt.values());
      var d = Math.max(20, Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y));
      var z1 = Math.max(0.75, Math.min(5, pinch.zoom0 * d / pinch.d0));
      var rect = canvas.getBoundingClientRect();
      var cx = (arr[0].x + arr[1].x) / 2 - rect.left, cy = (arr[0].y + arr[1].y) / 2 - rect.top;
      var z0 = state.zoom;
      state.panX = pinch.px0 * (z1 / pinch.zoom0) + (cx - cssW / 2) * (1 - z1 / pinch.zoom0);
      state.panY = pinch.py0 * (z1 / pinch.zoom0) + (cy - cssH / 2) * (1 - z1 / pinch.zoom0);
      state.zoom = z1;
      applyView(); scheduleScene();
    }
  });
  function ptEnd(e) {
    activePt.delete(e.pointerId);
    if (drag && dragMoved) suppressClick = true;
    drag = null; pinch = null;
  }
  canvas.addEventListener('pointerup', ptEnd);
  canvas.addEventListener('pointercancel', ptEnd);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.22 : 1 / 1.22);
  }, { passive: false });
  document.getElementById('btn-reset').addEventListener('click', function () {
    state.zoom = 1; state.panX = 0; state.panY = 0;
    applyView(); scheduleScene();
  });
  document.getElementById('btn-zin').addEventListener('click', function () {
    zoomAt(cssW / 2, cssH / 2, 1.5);
  });
  document.getElementById('btn-zout').addEventListener('click', function () {
    zoomAt(cssW / 2, cssH / 2, 1 / 1.5);
  });

  // ---------- layout & loop ----------
  function resize() {
    var w = wrap.clientWidth;
    if (w < 60) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var h = Math.min(828, Math.round(w * DOMH / DOMW) + 2 * M);
    cssW = w; cssH = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.height = h + 'px';
    baseScale = Math.min((w - 2 * M) / DOMW, (h - 2 * M) / DOMH);
    scale = baseScale * state.zoom;
    offX = (w - DOMW * scale) / 2 + state.panX;
    offY = (h - DOMH * scale) / 2 + state.panY;
    applyView();
    rebuildScene();
  }
  window.addEventListener('resize', function () { resize(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { TH = theme(); rebuildScene(); });

  if (reduceMotion) state.playing = false;
  resize();
  syncPlayIcon();
  loadState();
  renderRows([]);
  requestAnimationFrame(frame);
  setInterval(function () { dirtyRows = true; }, 3000);
})();
</script>
