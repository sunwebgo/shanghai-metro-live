<title>上海·苏州·杭州 城市地铁运行图 · 动态模拟</title>
<style>
:root {
  --background: #fcfcfd; --foreground: #18181b; --card: #ffffff; --card-foreground: #18181b;
  --muted: #f4f4f5; --muted-foreground: #71717c; --accent: #eef2ff; --accent-foreground: #1e1b4b;
  --border: #e4e4e7; --ring: #6366f1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #101014; --foreground: #f4f4f5; --card: #141418; --card-foreground: #f4f4f5;
    --muted: #1c1c22; --muted-foreground: #9d9da8; --accent: #23233a; --accent-foreground: #e0e7ff;
    --border: #2a2a33;
  }
}
html, body { margin: 0; padding: 0; background: var(--background); color: var(--foreground);
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
body { padding: 22px; }
.container { max-width: 1080px; margin: 0 auto; }
/* minimal utility equivalents for preview only */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 30px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--foreground); font-size: 13px; cursor: pointer; }
.btn:hover { background: var(--muted); }
.form-select { height: 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
  color: var(--foreground); font-size: 12.5px; padding: 0 6px; }
.form-range { width: 100%; accent-color: var(--foreground); }
.text-muted { color: var(--muted-foreground); }
.text-small { font-size: 12px; }
.tabular-nums { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.viz-stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.viz-stat-value { font-size: 17px; font-weight: 500; }
hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
i[data-lucide] { width: 15px; height: 15px; display: inline-block; }
</style>
</head>
<body>
<div class="container"><div id="errbox" style="background:#fee;border:1px solid #c33;color:#900;font-size:12px;padding:6px 10px;border-radius:8px;margin-bottom:10px;min-height:12px">-errors-</div>
<style id="shmetro-style">
#shmetro-app { --shline-w: 3.4px; }
.shmetro-root { display: flex; gap: 18px; align-items: stretch; }
.shmetro-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.shmetro-side { flex: 0 0 300px; max-width: 300px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

.shmetro-citytabs { display: flex; gap: 6px; flex-wrap: wrap; }
.shmetro-citytab { font-size: 13px; height: 30px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--card); color: var(--foreground); cursor: pointer; }
.shmetro-citytab:hover { background: var(--muted); }
.shmetro-citytab.is-active { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }

.shmetro-topbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.shmetro-clock { display: flex; align-items: baseline; gap: 10px; }
.shmetro-clock-time { font-size: 34px; font-weight: 500; line-height: 1; }
.shmetro-clock-band { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); align-self: center; }
.shmetro-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.shmetro-speed-label { display: flex; align-items: center; gap: 6px; }
.shmetro-label-lite { font-size: 12px; color: var(--muted-foreground); }

.shmetro-slider-row { display: flex; flex-direction: column; gap: 2px; }
.shmetro-slider-ticks { position: relative; height: 15px; }
.shmetro-slider-ticks span { position: absolute; transform: translateX(-50%); }
.shmetro-slider-ticks span:first-child { transform: none; }
.shmetro-slider-ticks span:last-child { transform: translateX(-100%); }

.shmetro-map-wrap { position: relative; width: 100%; }
#metro-canvas { display: block; width: 100%; border-radius: 10px; cursor: grab; }
.shmetro-viewctl { position: absolute; right: 10px; top: 10px; z-index: 4; display: flex; gap: 6px; }
.shmetro-zbtn { width: 28px; min-width: 28px; height: 26px; padding: 0; background: var(--card); font-size: 15px; line-height: 1; }
.shmetro-reset { font-size: 12px; height: 26px; padding: 0 9px; background: var(--card); }
.shmetro-tip { position: absolute; pointer-events: none; z-index: 5; background: var(--popover); color: var(--popover-foreground);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.45;
  box-shadow: 0 4px 14px rgba(0,0,0,.14); max-width: 260px; }
.shmetro-dir-legend { position: absolute; left: 10px; bottom: 10px; z-index: 4; display: flex; align-items: center; gap: 6px;
  font-size: 11px; background: var(--card); color: var(--card-foreground);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }
.l-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.6px solid #999; }
.l-dot.dir-fwd { background: #999; }
.l-dot.dir-bwd { background: transparent; }

.shmetro-side-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.shmetro-lines-list { display: flex; flex-direction: column; gap: 2px; max-height: 62vh; overflow-y: auto; padding-right: 4px; }
.shmetro-line-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 7px; cursor: pointer;
  border: none; background: transparent; width: 100%; text-align: left; font-size: 12.5px; color: var(--foreground); }
.shmetro-line-row:hover { background: var(--muted); }
.shmetro-line-row.is-selected { background: var(--accent); color: var(--accent-foreground); }
.shmetro-chip { width: 20px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.shmetro-row-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0 6px; }
.shmetro-row-name { display: flex; gap: 6px; align-items: baseline; }
.shmetro-row-name small { color: var(--muted-foreground); }
.shmetro-row-val { display: flex; gap: 10px; color: var(--muted-foreground); font-size: 11.5px; }

.shmetro-detail-card h3 { margin: 6px 0 8px; font-size: 15px; }
.shmetro-dpat { margin-bottom: 10px; }
.shmetro-dpat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.shmetro-dpat-head .shmetro-dpat-name { font-weight: 500; font-size: 12.5px; }
.shmetro-dpat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; }
.shmetro-dcell { background: var(--muted); border-radius: 7px; padding: 6px 8px; }
.shmetro-dcell b { display: block; font-weight: 500; }
.shmetro-dcell .text-small { display: block; }
.shmetro-interval-chart svg { display: block; width: 100%; height: 64px; }

@media (max-width: 860px) {
  .shmetro-root { flex-direction: column; }
  .shmetro-side { flex: 1 1 auto; max-width: none; }
  .shmetro-lines-list { max-height: none; }
}
</style>

<div id="shmetro-app" class="shmetro-root">
  <div class="shmetro-main">
    <div class="shmetro-citytabs" id="city-tabs" role="tablist" aria-label="城市切换"></div>
    <div class="shmetro-topbar">
      <div class="shmetro-clock">
        <span class="shmetro-clock-time tabular-nums" id="clock-time">07:45</span>
        <span class="shmetro-clock-band" id="clock-band"></span>
      </div>
      <div class="shmetro-ctl">
        <button type="button" class="btn" id="btn-play" aria-label="播放或暂停模拟" data-tooltip="播放 / 暂停">
          <i data-lucide="pause" aria-hidden="true"></i>
        </button>
        <label class="shmetro-speed-label" for="sel-speed">
          <span class="shmetro-label-lite">速度</span>
          <select id="sel-speed" class="form-select" aria-label="播放速度">
            <option value="5">5×（接近实时观感）</option>
            <option value="60" selected>60×（1秒=1分钟）</option>
            <option value="240">240×</option>
            <option value="900">900×（约16秒放完一天）</option>
          </select>
        </label>
      </div>
    </div>
    <div class="shmetro-slider-row">
      <label for="rng-time" class="sr-only">模拟时间</label>
      <input id="rng-time" class="form-range" type="range" min="0" max="1" step="0.001" value="0" aria-label="模拟时间，拖动跳转时刻" />
      <div class="shmetro-slider-ticks text-muted text-small" aria-hidden="true">
        <span style="left:0%">05:00</span><span style="left:21.7%">09:00</span><span style="left:42.8%">13:00</span><span style="left:63.8%">17:00</span><span style="left:84.9%">21:00</span><span style="left:99.5%">24:00</span>
      </div>
    </div>
    <div class="shmetro-map-wrap">
      <canvas id="metro-canvas" role="img" aria-label="城市地铁线路图动画：随时间推进显示各线路双向列车位置，支持滚轮缩放与拖拽平移"></canvas>
      <div class="shmetro-viewctl">
        <button type="button" class="btn shmetro-zbtn" id="btn-zin" aria-label="放大地图" data-tooltip="放大">＋</button>
        <button type="button" class="btn shmetro-zbtn" id="btn-zout" aria-label="缩小地图" data-tooltip="缩小">－</button>
        <button type="button" class="btn shmetro-reset" id="btn-reset" data-tooltip="恢复默认视野">重置视野</button>
      </div>
      <div class="shmetro-tip" id="map-tip" role="status" aria-live="polite" hidden></div>
      <div class="shmetro-dir-legend" aria-hidden="true">
        <span class="l-dot dir-fwd"></span><span>始发方向</span>
        <span class="l-dot dir-bwd"></span><span>对向</span>
      </div>
    </div>
  </div>
  <div class="shmetro-side">
    <div class="shmetro-side-stats" id="net-stats" aria-live="polite">
      <div class="viz-stat"><div class="text-muted text-small">当前在线列车（双向合计）</div><div class="viz-stat-value tabular-nums" id="stat-trains">—</div></div>
      <div class="viz-stat"><div class="text-muted text-small">当前最密集的线路</div><div class="viz-stat-value" id="stat-busiest">—</div></div>
    </div>
    <div id="line-detail"></div>
    <div class="shmetro-linepick">
      <div class="text-small text-muted">点击列表选择线路，或在图上直接点选</div>
      <div class="shmetro-lines-list" id="lines-list" role="listbox" aria-label="线路选择"></div>
    </div>
    <hr />
    <p class="text-small text-muted" id="src-note"></p>
  </div>
</div>

      var stL = (p.st || p.stA || []).map(function (s) { return s.m; });
      var lineName = patternLineName(c, p);
      var color = p.line_color || (c.lines.filter(function (x) { return p.no != null ? x.no === p.no : x.name === lineName; })[0] || {}).color || '#888888';

      function mileageAt(travelSec) {
        if (travelSec <= 0) return 0;

  function px(x) { return offX + (x - X_MIN) * scale; }
  function py(y) { return offY + (y - Y_MIN) * scale; }
  var scene = document.createElement('canvas');
  function rebuildScene() {
    scene.width = Math.max(1, Math.round(cssW * dpr));

    var c = scene.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, cssW, cssH);
    c.lineCap = 'round'; c.lineJoin = 'round';
    CITY.PAT.forEach(function (P) {
      c.strokeStyle = P.color; c.lineWidth = P.kind === 'tram' ? 3.4 : 4.2; c.globalAlpha = 0.92;
      c.beginPath();
      P.rawPts.forEach(function (a, i) { i ? c.lineTo(px(a[0]), py(a[1])) : c.moveTo(px(a[0]), py(a[1])); });
      c.stroke();
    });
    c.globalAlpha = 1;
    var inter = {}, term = {}, stnIdx = {};
    CITY.c.stations.forEach(function (s) { var kk = s.k || s.n || s.name; stnIdx[kk] = s; if ((s.lines || []).length >= 2) inter[kk] = s; });
    CITY.PAT.forEach(function (P) {
      (P.st || []).forEach(function (s0, i, a) {
        if (i === 0 || i === a.length - 1) {

    function free(x, y, w) {
      if (x - w / 2 < 3 || x + w / 2 > cssW - 3 || y < 12 || y > cssH - 13) return false;
      for (var i = 0; i < taken.length; i++) {
        var t = taken[i];
        if (Math.abs(t.x - x) < (t.w + w) / 2 + 5 && Math.abs(t.y - y) < 13) return false;
      }
      return true;
    }
    function drawLabel(nm, x, y, strong) {
      var w = 10.5 * nm.length;

      var lx = null, ly = null;
      for (var i = 0; i < place.length; i++) {
        var tx = x + place[i][0], ty = y + place[i][1];

      }
      if (lx == null && !strong) return;
      if (lx == null) { lx = x; ly = y - 9; }

  var lastTs = null, lastTSec = -1, lastHud = 0, dirtyRows = true, selected = null, rowEls = {};

    var simSec = Math.floor(state.t);
    var trains = trainsAt(simSec);
    if (selected != null) {

      ctx.restore();
      var sl = CITY.lineById[selected];

        ctx.save();

        CITY.PAT.filter(function (p) { return p.lineName === selected; }).forEach(function (P) {

  function hud(simSec, trains) {

    lastHud = now;
    if (simSec !== lastTSec) {
      lastTSec = simSec;

      document.getElementById('clock-band').textContent = '工作日 · ' + b.name;
      var rngEl = document.getElementById('rng-time');

    }
    document.getElementById('stat-trains').textContent = trains.length;
    var mx = {};
    trains.forEach(function (tr) { mx[tr.p.lineName] = (mx[tr.p.lineName] || 0) + 1; });
    var best = null, bestN = 0;
    Object.keys(mx).forEach(function (k) { if (mx[k] > bestN) { bestN = mx[k]; best = k; } });
    document.getElementById('stat-busiest').textContent = best ? best + ' · ' + bestN + ' 列' : '—';
    if (dirtyRows) { renderRows(trains); dirtyRows = false; }
  }

  function frame(ts) {
    if (state.playing) {
      if (lastTs == null) lastTs = ts;

  // ---------- hover / click ----------
  var rafPending = null;

  });

  function hit(cx, cy) {
    var bestSt = null, bestD = 8 * 8 * 2.2;

    for (var i = 0; i < sts.length; i++) {
      var s = sts[i];
      var dx = px(s.x) - cx, dy = py(s.y) - cy;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestSt = { type: 'station', s: s }; bestD = d; }
    }
    if (bestSt) return bestSt;
    var best = null; bestD = 43;
    for (var j = 0; j < CITY.PAT.length; j++) {
      var P = CITY.PAT[j], arr = P.rawPts;
      for (var k = 1; k < arr.length; k++) {
        var x1 = px(arr[k - 1][0]), y1 = py(arr[k - 1][1]);

  // ---------- sidebar ----------

  function intervalChart(P) {
    var t0 = t2sec(P.fwd && P.fwd.dep_first), t1 = t2sec(P.fwd && P.fwd.dep_last);
    if (t0 < 0) t0 = T_MIN;
    var W = 262, H = 56, STEPS = 60;
    var segs = [], cur = null;
    for (var i = 0; i <= STEPS; i++) {
      var tt = T_MIN + (T_MAX - T_MIN) * i / STEPS;
      var op = tt >= t0 && tt <= t1;
      var hv = hwOf(P, tt) / 60;
      if (op) {
        if (!cur) cur = [];
        cur.push([tt, Math.min(hv, 22)]);

    }
    if (cur && cur.length > 1) segs.push(cur);
    var paths = '';
    segs.forEach(function (s) {
      var d = s.map(function (pt, i) {
        var x = (pt[0] - T_MIN) / (T_MAX - T_MIN) * W;
        var y = H - 6 - Math.max(0, pt[1] - 2) / 20 * (H - 12);
        return (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);

    });

    });

      '<div class="text-small text-muted" style="margin-bottom:2px">发车间隔全天曲线（分钟，22封顶），断线时段已收车 · 竖线为时段分界</div>';
  }

  // ---------- persistence ----------

      });

  }
  function loadState() {
    try {
      var st = window.zcode && window.zcode.widgetState ? window.zcode.widgetState : null;
      var s = (st && (st.modelContent || st)) || {};
      if (typeof s.t === 'number' && s.t >= T_MIN && s.t <= T_MAX) { state.t = s.t; lastTSec = -1; }
      if (typeof s.speed === 'number') { state.speed = s.speed; document.getElementById('sel-speed').value = String(state.speed); }
      if (typeof s.playing === 'boolean') state.playing = reduceMotion ? false : s.playing;
      if (s.city && CITIES.filter(function (x) { return x.id === s.city; }).length) { state.city = s.city; }
      if (s.sel) { selected = s.sel; }
    } catch (e) { }
  }

  // ---------- zoom & pan ----------
  var drag = null, dragMoved = false, suppressClick = false;
  var activePt = new Map();
  var pinch = null;
  function clampPan() {
    var mx = Math.max(60, DOMW * scale - 60);
    var my = Math.max(60, DOMH * scale - 60);
    if (state.panX > mx) state.panX = mx;
    if (state.panX < -mx) state.panX = -mx;
    if (state.panY > my) state.panY = my;
    if (state.panY < -my) state.panY = -my;
  }
  function applyView() {
    if (!cssW) return;
    scale = baseScale * state.zoom;
    clampPan();
    offX = (cssW - DOMW * scale) / 2 + state.panX;
    offY = (cssH - DOMH * scale) / 2 + state.panY;
  }
  function zoomAt(cx, cy, factor) {
    var z0 = state.zoom;
    var z1 = Math.max(0.75, Math.min(5, z0 * factor));
    if (Math.abs(z1 - z0) < 1e-6) return;
    state.panX = state.panX * (z1 / z0) + (cx - cssW / 2) * (1 - z1 / z0);
    state.panY = state.panY * (z1 / z0) + (cy - cssH / 2) * (1 - z1 / z0);
    state.zoom = z1;
    applyView();
    scheduleScene();
  }
  canvas.addEventListener('pointerdown', function (e) {
    activePt.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePt.size === 1) {
      drag = { x: e.clientX, y: e.clientY, px: state.panX, py: state.panY };
      dragMoved = false;
      canvas.style.cursor = 'grabbing';
    } else {
      drag = null;
      var arr = Array.from(activePt.values());
      pinch = { d0: Math.max(20, Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y)), zoom0: state.zoom,
                px0: state.panX, py0: state.panY };
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (activePt.has(e.pointerId)) activePt.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) dragMoved = true;
      state.panX = drag.px + dx; state.panY = drag.py + dy;
      applyView(); scheduleScene();
      return;
    }
    if (pinch && activePt.size === 2) {
      var arr = Array.from(activePt.values());
      var d = Math.max(20, Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y));
      var rect = canvas.getBoundingClientRect();
      var cx = (arr[0].x + arr[1].x) / 2 - rect.left, cy = (arr[0].y + arr[1].y) / 2 - rect.top;
      var z1 = Math.max(0.75, Math.min(5, pinch.zoom0 * d / pinch.d0));
      var z0 = state.zoom;
      state.panX = pinch.px0 * (z1 / pinch.zoom0) + (cx - cssW / 2) * (1 - z1 / pinch.zoom0);
      state.panY = pinch.py0 * (z1 / pinch.zoom0) + (cy - cssH / 2) * (1 - z1 / pinch.zoom0);
      state.zoom = z1;
      applyView(); scheduleScene();
    }
  });
  function ptEnd(e) {
    activePt.delete(e.pointerId);
    if (drag && dragMoved) suppressClick = true;
    drag = null; pinch = null;
    canvas.style.cursor = 'grab';
  }
  canvas.addEventListener('pointerup', ptEnd);
  canvas.addEventListener('pointercancel', ptEnd);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.22 : 1 / 1.22);
  }, { passive: false });
  document.getElementById('btn-reset').addEventListener('click', function () {
    state.zoom = 1; state.panX = 0; state.panY = 0;
    applyView(); scheduleScene();
  });
  document.getElementById('btn-zin').addEventListener('click', function () { zoomAt(cssW / 2, cssH / 2, 1.5); });
  document.getElementById('btn-zout').addEventListener('click', function () { zoomAt(cssW / 2, cssH / 2, 1 / 1.5); });

  // ---------- city switch ----------
  function renderCityTabs() {
    var boxEl = document.getElementById('city-tabs');
    var html = '';
    CITIES.forEach(function (c) {
      html += '<button type="button" class="shmetro-citytab' + (state.city === c.id ? ' is-active' : '') + '" role="tab" aria-selected="' + (state.city === c.id) + '" data-city="' + c.id + '">' + c.name + '</button>';
    });
    boxEl.innerHTML = html;
    Array.prototype.forEach.call(boxEl.querySelectorAll('.shmetro-citytab'), function (btn) {
      btn.addEventListener('click', function () { switchCity(btn.getAttribute('data-city')); });
    });
  }
  function switchCity(id) {
    if (state.city === id) return;
    state.city = id;
    state.zoom = 1; state.panX = 0; state.panY = 0;
    selected = null;
    CITY = buildCity(id);
    document.getElementById('src-note').textContent = CITY_NOTES[id] || '';
    renderCityTabs();
    resize();
    document.getElementById('line-detail').innerHTML = '';
    dirtyRows = true;
    renderRows([]);
    persistState();
  }

  // ---------- controls ----------
  var btnPlay = document.getElementById('btn-play');
  function syncPlayIcon() {
    btnPlay.innerHTML = state.playing ? '<i data-lucide="pause" aria-hidden="true"></i>' : '<i data-lucide="play" aria-hidden="true"></i>';
    btnPlay.setAttribute('aria-label', state.playing ? '暂停模拟' : '播放模拟');
    btnPlay.setAttribute('data-tooltip', state.playing ? '暂停' : '播放');
    try { lucide.createIcons({ attrs: { width: 16, height: 16 } }); } catch (e) { }
  }
  btnPlay.addEventListener('click', function () {
    state.playing = !state.playing; syncPlayIcon(); persistState();
  });
  document.getElementById('sel-speed').addEventListener('change', function () { state.speed = +this.value; persistState(); });
  document.getElementById('rng-time').addEventListener('input', function () {
    state.t = T_MIN + (+this.value) * (T_MAX - T_MIN);
    lastTSec = -1; persistState();
  });

  // ---------- layout ----------
  function resize() {
    var w = wrap.clientWidth;
    if (w < 60) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var h = Math.min(828, Math.round(w * DOMH / DOMW) + 2 * M);
    cssW = w; cssH = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.height = h + 'px';
    baseScale = Math.min((w - 2 * M) / DOMW, (h - 2 * M) / DOMH);
    scale = baseScale * state.zoom;
    offX = (w - DOMW * scale) / 2 + state.panX;
    offY = (h - DOMH * scale) / 2 + state.panY;
    applyView();
    rebuildScene();
  }
  window.addEventListener('resize', function () { resize(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { TH = theme(); rebuildScene(); });

  if (reduceMotion) state.playing = false;
  loadState();
  CITY = buildCity(state.city);
  document.getElementById('src-note').textContent = CITY_NOTES[state.city] || '';
  renderCityTabs();
  resize();
  syncPlayIcon();
  renderRows([]);
  requestAnimationFrame(frame);
  setInterval(function () { dirtyRows = true; }, 3000);
})();
</script>

<script>
window.lucide = { createIcons: function () { /* preview stub: replace <i data-lucide> with unicode */ 
  document.querySelectorAll('i[data-lucide]').forEach(function (el) {
    var n = el.getAttribute('data-lucide');
    var span = document.createElement('span');
    span.textContent = n === 'pause' ? '⏸' : n === 'play' ? '▶' : n;
    span.style.fontSize = '13px';
    el.replaceWith(span);
  });
} };
</script>
</div>
</body>
</html>
